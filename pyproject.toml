[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tempo-server"
version = "0.1.0"
description = "Tempo: routes each question to the best available free or open-source LLM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 1.82.7 and 1.82.8 were malicious releases (March 2026 supply-chain attack).
    "litellm>=1.83,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
# Laya decision engine (pulls in torch + transformers; ~2.3 GB of checkpoints on first load).
laya = ["laya>=0.3.21"]
# Embedding task classifier and semantic cache (~65 MB model on first use).
embeddings = ["fastembed>=0.5"]

[project.scripts]
tempo = "tempo.cli:main"

[tool.setuptools.packages.find]
include = ["tempo*"]

[tool.setuptools.package-data]
tempo = ["models.yaml", "web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
