[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tempo-server"
version = "0.1.0"
description = "Tempo-server: open models plus the system that runs and trains them. Routes each question to the best free or open model, checks the answer, and runs on CPU."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "The Tempo-server authors"}]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    # 1.82.7 and 1.82.8 were malicious releases (March 2026 supply-chain attack).
    "litellm>=1.83,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "cryptography>=42",  # encrypts users' own provider keys at rest
    "jsonschema>=4",  # validates tool-call arguments and strict JSON answers (MIT)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
# Laya decision engine on CPU (pulls in torch + transformers for the one-time ONNX export, and
# ONNX Runtime; about 0.8 GB per checkpoint on first load).
laya = ["laya[onnx]>=0.3.21"]
# Embedding task classifier and semantic cache (~65 MB model on first use).
embeddings = ["fastembed>=0.5"]
# `tempo terms --check` reads NVIDIA's terms, which are a PDF.
terms = ["pypdf>=4"]

[project.scripts]
tempo = "tempo.cli:main"

[tool.setuptools.packages.find]
include = ["tempo*"]

[tool.setuptools.package-data]
tempo = ["models.yaml", "web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
