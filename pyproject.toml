[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tempo-server"
version = "0.1.0"
description = "Tempo-server: open models plus the system that runs and trains them. Routes each question to the best free or open model, checks the answer, and runs on CPU."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "The Tempo-server authors"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["llm", "openai-compatible", "router", "free-tier", "ollama", "litellm"]
requires-python = ">=3.11"
dependencies = [
    # 1.82.7 and 1.82.8 were malicious releases (March 2026 supply-chain attack).
    "litellm>=1.83,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "cryptography>=42",  # encrypts users' own provider keys at rest
    "jsonschema>=4",  # validates tool-call arguments and strict JSON answers (MIT)
    # Windows has no IANA time-zone database; free quotas reset at midnight in the provider's
    # zone (e.g. America/Los_Angeles for Google). Apache-2.0.
    "tzdata; sys_platform == 'win32'",
    "mcp>=2.2,<3",  # the official MCP Python SDK: `tempo-server mcp` (MIT)
    # WebAssembly runtime for the code and maths sandbox (tempo/sandbox.py); Bytecode Alliance,
    # wheels for Windows, macOS and Linux (Apache-2.0 WITH LLVM-exception).
    "wasmtime>=49,<60",
]

[project.urls]
Homepage = "https://github.com/narendrachampaneri/Tempo-server"
Documentation = "https://github.com/narendrachampaneri/Tempo-server#readme"
Issues = "https://github.com/narendrachampaneri/Tempo-server/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.16,<0.17"]
# Laya decision engine on CPU (pulls in torch + transformers for the one-time ONNX export, and
# ONNX Runtime; about 0.8 GB per checkpoint on first load).
laya = ["laya[onnx]>=0.3.21"]
# Embedding task classifier and semantic cache (~65 MB model on first use).
embeddings = ["fastembed>=0.5"]
# Training Tempo's own models (tempo/trainkit.py): the Kaggle notebooks install these, and
# `tempo-server train dry-run` needs them on your computer. Never in the core install.
# On Linux, install PyTorch's CPU build first unless you have a GPU (docs/TRAINING.md):
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
train = [
    "torch>=2.4",
    "transformers>=5,<6",
    "peft>=0.17",
    "trl>=1.0,<2",
    "datasets>=3",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "sentencepiece>=0.2",  # llama.cpp's GGUF converter imports it
    "gguf>=0.17",
    "huggingface_hub>=0.30",
    "laya>=0.3.21",
]
# `tempo terms --check` reads NVIDIA's terms, which are a PDF.
terms = ["pypdf>=4"]

[project.scripts]
# `tempo-server` is the command. Grafana Tempo also installs a `tempo` program, so the short
# alias prints a notice and goes away before 1.0 (owner's decision, step 6).
tempo-server = "tempo.cli:main"
tempo = "tempo.cli:main_alias"

[tool.setuptools.packages.find]
include = ["tempo*"]

[tool.setuptools.package-data]
tempo = ["models.yaml", "web/*", "data/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "sdk/python/tests"]
# the Python SDK is tested from its source folder (it is a separate package: sdk/python)
pythonpath = ["sdk/python/src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PLW1514"]
# PLW1514 (open/read_text/write_text without an encoding) is a preview rule: Windows would
# otherwise use its ANSI code page.
preview = true
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
# Programs that run inside the sandbox are embedded as strings (no # noqa possible there).
"tempo/execute.py" = ["E501"]
