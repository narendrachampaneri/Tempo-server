# Labelled example requests for the embedding classifier (one list per task).
# New requests are compared with these by meaning, so wording does not need to match.
# Add examples from your own traffic to improve it; keep each task roughly balanced.

chat:
  - hi there
  - good morning, how are you?
  - thanks, that helped a lot
  - who are you?
  - tell me a fun fact
  - what can you do?
  - I'm bored, talk to me
  - nice to meet you
  - can you hear me?
  - what's your favourite colour?
  - ok cool
  - hello again

