# Example: run `tempo collect` every 6 hours on GitHub Actions, resuming across runs.
# Not active here. To use it, copy it to .github/workflows/collect.yml in a PRIVATE repository
# and add your own keys as repository secrets (see docs/COLLECT_ANYWHERE.md).
name: Tempo collect

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours, off the hour
  workflow_dispatch:

concurrency:
  group: tempo-collect
  cancel-in-progress: false # never two runs at once

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TEMPO_DATA_DIR: ${{ github.workspace }}/.tempo-data
      TEMPO_LAYA: "off" # labels come from outcomes; Laya is not needed to collect
      TEMPO_EMBEDDINGS: "off"
      TEMPO_SYNC_INTERVAL: "0"
      TEMPO_SECRET_KEY: ${{ secrets.TEMPO_SECRET_KEY }}
      # Only the keys you add as secrets are set; missing ones are simply empty.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Tempo
        run: pip install -e .

      - name: Restore progress and quota counters
        uses: actions/cache/restore@v4
        with:
          path: .tempo-data
          key: tempo-collect-${{ github.run_id }}
          restore-keys: tempo-collect-

      - name: Refresh the free-model catalog
        run: tempo sync

      - name: Collect (stops when free quota runs out or time is up)
        run: tempo collect --no-wait --minutes 45 --per-minute 2 --reserve 0.5

      - name: Save progress and quota counters
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .tempo-data
          key: tempo-collect-${{ github.run_id }}

      - name: Progress
        if: always()
        run: tempo collect --status

      - name: Export the "yes" rows
        if: always()
        run: tempo export-laya --out laya-dataset || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laya-dataset
          path: laya-dataset
          if-no-files-found: ignore
          retention-days: 30
