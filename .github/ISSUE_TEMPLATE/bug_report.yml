name: Bug report
description: Something in Tempo-server doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste a real API key**, in the text, logs or screenshots: Tempo-server
        shows stored keys only as a fingerprint (`fp:1a2b3c4d`), and that is all we need.
        Security problems go to the private form instead (Security → Report a vulnerability), see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command, request or web page steps. Demo mode (`TEMPO_ENABLE_MOCK=1`) is ideal if it shows the problem.
      placeholder: |
        1. tempo-server ask "..."
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tempo-server version
      description: "`tempo-server --version`"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Docker, Other]
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How it was installed
      options: [One-line installer, pipx, uv tool, pip, Docker, From a clone (development)]
  - type: textarea
    id: doctor
    attributes:
      label: "`tempo-server doctor` output"
      description: Optional. Check it for anything private before pasting.
      render: text
