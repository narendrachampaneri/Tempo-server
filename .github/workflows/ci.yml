# Tests, lint, the package build and install tests. Publishes nothing.
#
# To save free CI minutes while the repository is private (owner's decisions, step 6):
#   - every push:                Linux, every supported Python version, and a Linux install test
#   - pull requests and releases: also Windows (every Python version) and macOS (one version),
#                                 and install tests on all three systems
#   - pushes to main, once the repository is public (Actions minutes are free then): also
#     Windows, macOS and the install tests on all three systems. This switches on by itself
#     when the repository is made public.
name: CI

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "0"  # test with each system's own default encoding, as users have it
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    # A pull request from this repository already ran everything on its push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.16,<0.17"
      - run: ruff check .
      - run: ruff format --check .

  test-linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Sandbox runtimes (cached between runs)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tempo-sandbox
          key: sandbox-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tempo/sandbox.py') }}
      - name: Install the sandbox (downloads checked by SHA-256); its tests must run, not skip
        shell: bash
        run: |
          echo "TEMPO_SANDBOX_HOME=$RUNNER_TEMP/tempo-sandbox" >> "$GITHUB_ENV"
          echo "TEMPO_SANDBOX_REQUIRED=1" >> "$GITHUB_ENV"
          TEMPO_SANDBOX_HOME="$RUNNER_TEMP/tempo-sandbox" tempo-server sandbox install
      - run: pytest -q

  test-windows:
    if: github.event_name != 'push' || (github.ref == 'refs/heads/main' && !github.event.repository.private)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Sandbox runtimes (cached between runs)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tempo-sandbox
          key: sandbox-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tempo/sandbox.py') }}
      - name: Install the sandbox (downloads checked by SHA-256); its tests must run, not skip
        shell: bash
        run: |
          echo "TEMPO_SANDBOX_HOME=$RUNNER_TEMP/tempo-sandbox" >> "$GITHUB_ENV"
          echo "TEMPO_SANDBOX_REQUIRED=1" >> "$GITHUB_ENV"
          TEMPO_SANDBOX_HOME="$RUNNER_TEMP/tempo-sandbox" tempo-server sandbox install
      - run: pytest -q

  test-macos:
    if: github.event_name != 'push' || (github.ref == 'refs/heads/main' && !github.event.repository.private)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Sandbox runtimes (cached between runs)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tempo-sandbox
          key: sandbox-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tempo/sandbox.py') }}
      - name: Install the sandbox (downloads checked by SHA-256); its tests must run, not skip
        shell: bash
        run: |
          echo "TEMPO_SANDBOX_HOME=$RUNNER_TEMP/tempo-sandbox" >> "$GITHUB_ENV"
          echo "TEMPO_SANDBOX_REQUIRED=1" >> "$GITHUB_ENV"
          TEMPO_SANDBOX_HOME="$RUNNER_TEMP/tempo-sandbox" tempo-server sandbox install
      - run: pytest -q

  train-dry-run:
    # The whole training loop on a CPU with tiny models and no keys (docs/TRAINING.md): demo
    # data, train prepare, both Kaggle notebooks executed cell by cell, models import, compare
    # and promote. About 5 minutes of it is training; Linux only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (PyTorch's CPU build first, then the [train] extra)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[train]"
      - name: Downloads (tokenizers, Laya's configs, llama.cpp) cached between runs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ${{ runner.temp }}/llama.cpp
          key: train-dry-run-${{ hashFiles('tempo/trainkit.py') }}
      - name: tempo-server train dry-run
        run: |
          TEMPO_LLAMA_CPP="$RUNNER_TEMP/llama.cpp" \
            tempo-server train dry-run --work "$RUNNER_TEMP/dry-run"
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-dry-run-reports
          path: |
            ${{ runner.temp }}/dry-run/kaggle/*/tempo-*/REPORT.md
            ${{ runner.temp }}/dry-run/kaggle/*/tempo-*/report.json
            ${{ runner.temp }}/dry-run/data/models/models.json
          if-no-files-found: ignore

  web-e2e:
    # The web app in a real browser (Chromium via Playwright): main flows, accessibility basics,
    # contrast in both themes, and screenshots at phone, tablet and desktop widths. Linux only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,e2e]"
      - run: playwright install --with-deps chromium
      - name: Browser tests
        run: TEMPO_REQUIRE_E2E=1 TEMPO_SCREENSHOTS=1 pytest tests/test_web_e2e.py -q
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshots
          path: docs/screenshots
          if-no-files-found: ignore

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  install:
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'push' && (github.ref != 'refs/heads/main' || github.event.repository.private)) && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    env:
      TEMPO_EMBEDDINGS: "off"
      TEMPO_SERVER_SETUP_ARGS: "--non-interactive --no-sync"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Smoke-test helper
        run: |
          cat > "$RUNNER_TEMP/smoke.sh" <<'EOF'
          # usage: smoke.sh <path to tempo-server>
          set -euo pipefail
          bin="$1"
          export TEMPO_DATA_DIR="$RUNNER_TEMP/tempo-data-$RANDOM"
          "$bin" --version | grep -q "^tempo-server "
          "$bin" setup --non-interactive --no-sync
          TEMPO_ENABLE_MOCK=1 "$bin" ask "What is 17% of 2,340?" > "$RUNNER_TEMP/answer.txt"
          grep -q "demo answer" "$RUNNER_TEMP/answer.txt"
          "$bin" doctor --offline --port 8765
          echo "OK: $("$bin" --version)"
          EOF
          echo "WHEEL=$(ls "$PWD"/dist/*.whl)" >> "$GITHUB_ENV"
          # where uv and its tools go (~/.local/bin; on Windows %USERPROFILE%\.local\bin)
          if [ "$RUNNER_OS" = Windows ]; then home="$(cygpath -u "$USERPROFILE")"; else home="$HOME"; fi
          echo "LOCAL_BIN=$home/.local/bin" >> "$GITHUB_ENV"
          command -v uv && echo "uv is already on this runner" || echo "no uv: the installer installs it"

      # The one-line installers first, on a runner without uv: they must install it themselves.
      - name: install.sh (installs uv, then tempo-server)
        if: runner.os != 'Windows'
        run: |
          TEMPO_SERVER_SOURCE="$WHEEL" TEMPO_SERVER_INSTALLER=uv sh install.sh
          bash "$RUNNER_TEMP/smoke.sh" "$(uv tool dir --bin)/tempo-server"
          uv tool uninstall tempo-server
      - name: install.sh with pipx
        if: runner.os != 'Windows'
        run: |
          TEMPO_SERVER_SOURCE="$WHEEL" TEMPO_SERVER_INSTALLER=pipx sh install.sh
          bash "$RUNNER_TEMP/smoke.sh" "$(pipx environment --value PIPX_BIN_DIR)/tempo-server"
          pipx uninstall tempo-server
      - name: install.ps1 (installs uv, then tempo-server)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:TEMPO_SERVER_SOURCE = (Get-ChildItem dist\*.whl).FullName
          $env:TEMPO_SERVER_INSTALLER = "uv"
          ./install.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Smoke test after install.ps1
        if: runner.os == 'Windows'
        run: |
          export PATH="$LOCAL_BIN:$PATH"
          bash "$RUNNER_TEMP/smoke.sh" "$(cygpath -u "$(uv tool dir --bin)")/tempo-server.exe"
          uv tool uninstall tempo-server
      - name: install.ps1 with pipx
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:TEMPO_SERVER_SOURCE = (Get-ChildItem dist\*.whl).FullName
          $env:TEMPO_SERVER_INSTALLER = "pipx"
          ./install.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & pipx uninstall tempo-server

      # Then the two tools directly, as the README shows them.
      - name: pipx install
        run: |
          pipx install "$WHEEL"
          bin_dir="$(pipx environment --value PIPX_BIN_DIR)"
          [ "$RUNNER_OS" = Windows ] && bin_dir="$(cygpath -u "$bin_dir")"
          bash "$RUNNER_TEMP/smoke.sh" "$bin_dir/tempo-server"
          pipx uninstall tempo-server
      - name: uv tool install
        run: |
          export PATH="$LOCAL_BIN:$PATH"
          uv tool install --python 3.12 "$WHEEL"
          bin_dir="$(uv tool dir --bin)"
          [ "$RUNNER_OS" = Windows ] && bin_dir="$(cygpath -u "$bin_dir")"
          bash "$RUNNER_TEMP/smoke.sh" "$bin_dir/tempo-server"
          uv tool uninstall tempo-server

  sdk:
    # Both SDKs against a real demo-mode Tempo-server (each test suite starts one with a user
    # key), on the same systems and schedule as the install tests. Builds both packages and
    # checks them; publishes nothing.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'push' && (github.ref != 'refs/heads/main' || github.event.repository.private)) && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        node: ["22"]
        include:
          - os: ubuntu-latest
            node: "20"
    defaults:
      run:
        shell: bash
    env:
      TEMPO_PYTHON: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json
      - name: Install Tempo-server and the Python SDK as users get them
        run: pip install . ./sdk/python pytest build twine
      - name: Python SDK tests
        working-directory: sdk/python
        run: python -m pytest -q tests -p no:cacheprovider
      - name: Python SDK package
        working-directory: sdk/python
        run: python -m build --outdir "$RUNNER_TEMP/sdk-dist" && twine check --strict "$RUNNER_TEMP"/sdk-dist/*
      - name: JavaScript SDK tests (build with tsc, then node --test)
        working-directory: sdk/js
        run: npm ci && npm test
      - name: JavaScript SDK package
        working-directory: sdk/js
        run: npm pack --dry-run
